  <text class="s" x="2" y="296" font-size="38" font-weight="400" letter-spacing="-0.6" fill="#656d76">and the backend that <tspan fill="#1f2328">keeps them honest</tspan>.</text>

  <line x1="2" y1="334.5" x2="1198" y2="334.5" stroke="#d0d7de" stroke-width="1"/>
  <rect x="2" y="333" width="120" height="3" fill="#c4522a">
